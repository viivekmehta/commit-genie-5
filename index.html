<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Spokes AI Agents | Knowledge26 Lab</title><link rel="stylesheet" /><style>* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  font-family:'Outfit',sans-serif;
  background:#061525;
  color:#e8f4f8;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

.header-img,
.footer-img {
  width:100%;
  display:block;
  flex-shrink:0;
}

.qz-card {
  background:rgba(10,31,51,0.85);
  border:1px solid rgba(98,216,78,0.15);
  border-radius:12px;
  max-width:400px;
  width:100%;
  padding:32px 20px;
  box-shadow:none;
  text-align:center;
}

.qz-q {
  font-size:1.18rem;
  font-weight:600;
  margin-bottom:18px;
}

.qz-opt {
  display:block;
  width:100%;
  background:rgba(6,21,37,0.8);
  border:1px solid rgba(98,216,78,0.2);
  color:#e8f4f8;
  border-radius:8px;
  padding:12px 0;
  margin:8px 0;
  cursor:pointer;
  font-size:1rem;
  transition:background .15s;
}

.qz-opt:hover { background:#0e2d47; }

.qz-btn {
  background:linear-gradient(135deg,#62d84e,#00c7b1);
  color:#061525;
  font-weight:700;
  border-radius:10px;
  padding:12px 24px;
  border:none;
  cursor:pointer;
  font-size:1rem;
  margin-top:18px;
  transition:transform .1s;
}

.qz-btn:active { transform:translateY(2px); }

.qz-status {
  margin:16px 0 0 0;
  font-size:1rem;
  color:#62d84e;
}

.qz-wrong { color:#ff5c5c; }

.qz-score {
  font-size:1.2rem;
  font-weight:600;
  margin-bottom:10px;
}

.qz-summary {
  margin-top:18px;
  text-align:left;
  font-size:.98rem;
}

@media (max-width:500px) {
  .qz-card { padding:18px 4px; }
}
</style></head><body>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/header-banner.jpg" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div class="qz-card" id="quizCard">
      <div id="quizContent"></div>
    </div>
  </div>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/footer-banner.jpg" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />
  
</body></html>
